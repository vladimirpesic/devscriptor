name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  slow-tests:
    name: Slow tests and the VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Where Devscriptor loads the model from on Linux, so the tests find the
      # cached copy instead of downloading it.
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/devscriptor/models/jina-embeddings-v2-base-code
          # The revision and the file list are pinned in model_fetch.rs.
          key: jina-model-${{ hashFiles('crates/core/src/embeddings/model_fetch.rs') }}
      - name: Download the embedding model
        run: |
          if [ ! -f ~/.cache/devscriptor/models/jina-embeddings-v2-base-code/onnx/model_quantized.onnx ]; then
            bash scripts/download-embedding-model.sh
          fi

      # The tests run one at a time (.cargo/config.toml): about 55 and 25 minutes,
      # with the release build inside each step, which takes longer when
      # Cargo.lock changed and the build cache is cold.
      - name: Slow tests (core)
        run: cargo test -p devscriptor-core --features slow-tests --release --locked -- --nocapture
        timeout-minutes: 90
      - name: Slow tests (MCP server with the real model)
        run: cargo test -p devscriptor-mcp --features slow-tests --release --locked -- --nocapture
        timeout-minutes: 45

      - name: Build the release binary
        run: cargo build -p devscriptor-cli --release --locked
      - name: Put the binary on PATH
        run: |
          mkdir -p ~/.local/bin
          cp target/release/devscriptor ~/.local/bin/devscriptor
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install the extension's dependencies
        run: npm ci
        working-directory: vscode-extension
      # Every extension test, in the VS Code it downloads, on a virtual display.
      - name: Extension tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          DEVSCRIPTOR_BIN="$HOME/.local/bin/devscriptor" xvfb-run -a npm test
        working-directory: vscode-extension
        timeout-minutes: 15

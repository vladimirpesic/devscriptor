name: Release

# A `v*` tag builds every platform's archive and publishes them as a GitHub
# release. A manual run, or a push to main that changes this workflow, builds
# and checks the archives without publishing them.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, jobs: 4 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, jobs: 4 }
          - { target: aarch64-apple-darwin, os: macos-latest, jobs: 3 }
          - { target: x86_64-apple-darwin, os: macos-26-intel, jobs: 4 }
          # The C runtime linked in, so the binary needs no Visual C++
          # redistributable.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, jobs: 4, rustflags: '-C target-feature=+crt-static' }
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The oldest macOS the release supports (docs/installation.md).
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools
      # cargo-zigbuild links against glibc 2.17 whatever the runner's glibc is.
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v$version, the version in Cargo.toml"
            exit 1
          fi
          exe=devscriptor
          if [ "$RUNNER_OS" = Windows ]; then exe=devscriptor.exe; fi
          {
            echo "version=$version"
            echo "name=devscriptor-$version-${{ matrix.target }}"
            echo "bin=target/${{ matrix.target }}/release/$exe"
            echo "exe=$exe"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}.2.17" -p devscriptor-cli
          else
            cargo build --release --locked --target "${{ matrix.target }}" -p devscriptor-cli
          fi

      - name: Check the binary
        shell: bash
        run: |
          bin=${{ steps.version.outputs.bin }}
          "$bin" --version
          test "$("$bin" --version)" = "devscriptor ${{ steps.version.outputs.version }}"
          started=$("$bin" --verbose mcp --no-daemon --no-watch </dev/null 2>&1 >/dev/null | grep -m1 "Starting Unified MCP Server" || true)
          echo "$started"
          [[ "$started" == *"(75 tools)"* ]] || { echo "::error::The MCP server did not start with 75 tools"; exit 1; }
          sysroot=$(rustc --print sysroot)
          if [ "$RUNNER_OS" = Windows ]; then sysroot=$(cygpath -u "$sysroot"); fi
          objdump=$sysroot/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-objdump
          case "$RUNNER_OS" in
            Linux)
              floor=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
              echo "glibc floor: $floor"
              test "$(printf '%s\nGLIBC_2.17\n' "$floor" | sort -V | tail -1)" = GLIBC_2.17
              ! ldd "$bin" | grep -E 'stdc\+\+|ssl'
              ;;
            macOS)
              minos=$("$objdump" --macho --private-headers "$bin" | sed -n 's/^ *minos //p' | head -1)
              echo "minimum macOS: $minos"
              test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"
              ! otool -L "$bin" | grep -E 'c\+\+|ssl'
              ;;
            Windows)
              dlls=$("$objdump" -p "$bin" | sed -n 's/^ *DLL Name: //p')
              echo "$dlls"
              ! grep -iE 'vcruntime|msvcp|ucrtbase|api-ms-win-crt' <<<"$dlls"
              # The main thread's 8 MiB stack (crates/cli/build.rs).
              stack=$("$objdump" -p "$bin" | awk '/SizeOfStackReserve/ {print $2}')
              echo "main thread stack: 0x$stack"
              test $((16#$stack)) -eq 8388608
              ;;
          esac

      - name: Package
        shell: bash
        run: |
          name=${{ steps.version.outputs.name }}
          mkdir -p "dist/$name"
          cp "${{ steps.version.outputs.bin }}" "dist/$name/${{ steps.version.outputs.exe }}"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            archive=$name.zip
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive=$name.tar.gz
            COPYFILE_DISABLE=1 tar -czf "$archive" "$name"
          fi
          rm -r "$name"
          if command -v sha256sum >/dev/null; then sum=$(sha256sum <"$archive"); else sum=$(shasum -a 256 <"$archive"); fi
          echo "${sum%% *}  $archive" >"$archive.sha256"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

  # The release installs language servers from the LSP mirror release
  # mirror.json pins, and falls back to the model mirror release: both must be
  # published, whole, before it is.
  mirrors:
    name: Mirrors
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check-mirrors.py

  publish:
    name: Publish
    needs: [build, mirrors]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # What the VS Code extension's update check reads (docs/building.md).
      - name: Write latest.json
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import datetime, json, pathlib, sys
          platforms = {
              "x86_64-unknown-linux-gnu": "linux-x64",
              "aarch64-unknown-linux-gnu": "linux-arm64",
              "aarch64-apple-darwin": "macos-arm64",
              "x86_64-apple-darwin": "macos-x64",
              "x86_64-pc-windows-msvc": "windows-x64",
          }
          tag = sys.argv[1]
          assets = []
          for target, platform in platforms.items():
              name = f"devscriptor-{tag[1:]}-{target}" + (".zip" if "windows" in target else ".tar.gz")
              if not pathlib.Path("dist", name).is_file():
                  sys.exit(f"missing {name}")
              assets.append({"name": name, "platform": platform})
          published = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          latest = {"tag_name": tag, "published_at": published, "assets": assets}
          pathlib.Path("dist/latest.json").write_text(json.dumps(latest, indent=2) + "\n")
          EOF
          cat dist/latest.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --latest --title "Devscriptor ${GITHUB_REF_NAME#v}" --generate-notes

# Weekly pull requests that update the GitHub Actions the workflows pin by
# commit, and the packages the lockfiles pin, each ecosystem's in one group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The extension runs on VS Code 1.74 and later (engines.vscode), whose
      # extension host is Node.js 16: what it ships, and the Node.js typings it
      # is checked against, stay on majors that support it.
      - dependency-name: which
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
